<svg width="1400" height="600" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>

<g fill="#f9fafb" stroke="#6b7280" stroke-width="0.75">
<rect x="280" y="30" width="140" height="44" rx="8"/>
</g>
<text x="350" y="47" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">One trial</text>
<text x="350" y="63" font-size="10" fill="#6b7280" text-anchor="middle">e.g. one kill</text>

<g stroke="#9ca3af" stroke-width="0.75" fill="none">
<line x1="330" y1="74" x2="220" y2="150"/>
<line x1="370" y1="74" x2="480" y2="150"/>
</g>

<g font-size="10" font-weight="600" text-anchor="middle">
<text x="255" y="108" fill="#d97706">p</text>
<text x="450" y="108" fill="#4b5563">1 &#8722; p</text>
</g>

<g fill="#fef3c7" stroke="#d97706" stroke-width="1">
<rect x="100" y="150" width="220" height="72" rx="8"/>
</g>
<text x="210" y="178" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Drop (D)</text>
<text x="210" y="198" font-size="11" fill="#92400e" text-anchor="middle">success &#8212; item drops</text>

<g fill="#f9fafb" stroke="#6b7280" stroke-width="0.75">
<rect x="380" y="150" width="220" height="72" rx="8"/>
</g>
<text x="490" y="178" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">No drop (N)</text>
<text x="490" y="198" font-size="11" fill="#4b5563" text-anchor="middle">failure &#8212; item does not drop</text>

<text x="350" y="262" font-size="12" fill="#374151" text-anchor="middle">Mutually exclusive and exhaustive:</text>
<text x="350" y="280" font-size="12" fill="#374151" text-anchor="middle">every trial lands in exactly one of these two outcomes &#8212; never both, never neither.</text>

</svg>
